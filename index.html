<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADS-B Flight Tracker</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="styles.css"></head><body><header><div class="brand"><span class="logo">✈</span><div><b>ADS-B FLIGHT TRACKER</b><small>LIVE GLOBAL AIRSPACE</small></div></div><nav><button class="active">● LIVE</button><button id="airportsBtn">AIRPORTS</button><button id="replayBtn">REPLAY</button><button id="locBtn">⌖ MY AREA</button></nav></header><main><section id="map"></section><aside><div class="search"><input id="search" placeholder="Callsign, registration, ICAO or type"></div><div class="controls"><input id="lat" type="number" step=".0001" value="36.8065"><input id="lon" type="number" step=".0001" value="10.1815"><select id="dist"><option>25</option><option>50</option><option selected>100</option><option>150</option><option>250</option></select><button id="refresh">↻</button></div><div class="status"><span id="statusDot"></span><span id="status">Connecting...</span><span id="count">0 aircraft</span></div><div id="airportPanel" class="hidden"><input id="airportSearch" placeholder="Search 85,000+ airports"><div id="airportResults"></div></div><div id="list"></div></aside></main><section id="details" class="drawer hidden"><button id="closeDetails">×</button><div id="detailContent"></div></section><section id="replay" class="replay hidden"><b>REPLAY</b><span id="replayTime">-</span><input id="replaySlider" type="range" min="0" max="100" value="0"><button id="clearReplay">Close</button></section><footer>Live ADS-B: ADSB.lol · Routes/aircraft: ADSBdb · Airports: OurAirports · Photos: Planespotters · Map © OpenStreetMap</footer><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="app.js"></script></body></html>
